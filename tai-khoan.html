<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><title>Tài khoản Timemark – Số dư, đơn hàng và lịch sử giao dịch</title><meta name="description" content="Xem số dư tài khoản Timemark, tra cứu giao dịch nạp tiền, các gói key đã mua và đơn đặt ảnh của bạn."><link rel="stylesheet" href="theme-shared.css"><style>

</style></head><body><main><nav><a href="index.html">← Trang chủ Timemark</a><a href="app/order-test.html">Đặt ảnh theo mẫu</a></nav><h1>Tài khoản của tôi</h1><p id="mode">Đang kiểm tra kết nối…</p><section id="auth" class="panel" hidden><h2>Đăng nhập hoặc tạo tài khoản</h2><form id="authForm"><label>Địa chỉ Gmail<input id="email" type="email" required autocomplete="username" pattern=".+@gmail\.com"></label><label>Mật khẩu riêng của Timemark<input id="pass" type="password" minlength="8" required autocomplete="current-password"></label><div class="actions"><button value="login">Đăng nhập</button><button class="sub" value="signup">Tạo tài khoản</button></div></form></section>
